<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elektrotehnika (test)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--paper:#EEF2F5;--sheet:#FFFFFF;--grid:#DDE5EB;--ink:#1C2B3A;--muted:#5D6D7C;--line:#C9D4DD;
--mark:#F2C230;--ok:#2B8A57;--bad:#C2413A;--btn:#E3EAF0;
--f-body:"Atkinson Hyperlegible",system-ui,sans-serif;--f-head:"Barlow Condensed","Arial Narrow",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121A22;--sheet:#1A2530;--grid:#24323F;--ink:#E4ECF2;--muted:#93A5B4;--line:#33475A;--btn:#243443;--mark:#E9B824}}
:root[data-theme="dark"]{--paper:#121A22;--sheet:#1A2530;--grid:#24323F;--ink:#E4ECF2;--muted:#93A5B4;--line:#33475A;--btn:#243443;--mark:#E9B824}
*{box-sizing:inherit}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--sheet)}
.brand{font-family:var(--f-head);font-weight:700;font-size:28px;letter-spacing:.5px;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted);letter-spacing:0}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav button{font:inherit;font-size:15px;background:none;border:0;padding:8px 12px;border-radius:6px;color:var(--muted);cursor:pointer}
nav button[aria-current="true"]{background:var(--btn);color:var(--ink);font-weight:700}
.rating{display:flex;align-items:center;gap:10px}
#hdrNick{font-weight:700;color:var(--ink);font-size:14px}
.rating b{font-family:var(--f-head);font-size:40px;line-height:1;font-weight:700}
.rating span{font-size:13px;color:var(--muted);max-width:7em;line-height:1.2}
main{max-width:1180px;margin:0 auto;padding:20px}
.board{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:860px){.board{grid-template-columns:1fr}}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:10px}
.schem{padding:10px;overflow-x:auto}
.schem svg{display:block;width:100%;height:auto;max-height:62vh}
.side{padding:20px}
.q{font-size:19px;margin:0 0 14px}
.q strong{background:var(--mark);color:#1C2B3A;padding:0 5px;border-radius:3px}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;padding:12px 14px;border:2px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:8px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt kbd{font-family:var(--f-head);font-weight:700;margin-right:8px;color:var(--muted)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--sheet))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--sheet))}
.opt:disabled{cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.toggle{display:flex;gap:10px;align-items:flex-start;margin:18px 0 0;padding-top:16px;border-top:1px solid var(--line);font-size:15px;cursor:pointer}
.toggle input{width:20px;height:20px;margin-top:2px;accent-color:var(--ink)}
.toggle small{display:block;color:var(--muted)}
.fb{margin-top:16px;font-size:15px}
.fb h3{margin:0 0 4px;font-family:var(--f-head);font-size:24px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.delta{font-family:var(--f-head);font-size:18px;color:var(--muted)}
.primary{font:inherit;font-weight:700;background:var(--ink);color:var(--sheet);border:0;border-radius:8px;padding:12px 18px;cursor:pointer;margin-top:14px}
.ghost{font:inherit;background:var(--btn);color:var(--ink);border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:6px 12px 2px}
h2{font-family:var(--f-head);font-size:32px;margin:0 0 10px;line-height:1.1}
.panel{padding:24px;max-width:760px}
table{border-collapse:collapse;width:100%}
td,th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-weight:700;color:var(--muted);font-size:14px}
.num{font-family:var(--f-head);font-size:22px;font-weight:600}
.bar{height:8px;background:var(--btn);border-radius:4px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--ink)}
input[type=text]{font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink);width:100%;max-width:320px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{color:var(--muted);font-size:14px}
.banklist{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.banklist button{font:inherit;font-size:13px;padding:5px 9px;border-radius:5px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer}
.banklist button[aria-current="true"]{background:var(--ink);color:var(--sheet)}
.timer{font-family:var(--f-head);font-size:22px}
footer{max-width:1180px;margin:0 auto;padding:4px 20px 10px;color:var(--muted);font-size:12px;text-align:center;opacity:.8}
.modwrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.modlvl{font-size:15px;color:var(--muted)}.modlvl b{font-family:var(--f-head);font-size:22px;color:var(--ink);margin-left:4px}
.modlabel{font-weight:700;font-size:15px}
.modbar{display:flex;gap:4px;flex-wrap:wrap;margin:0;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:4px;width:fit-content;max-width:100%}
.modbar button{font:inherit;font-size:15px;border:0;background:none;color:var(--muted);padding:8px 14px;border-radius:7px;cursor:pointer}
.modbar button[aria-current="true"]{background:var(--ink);color:var(--sheet);font-weight:700}
.modbar b{font-family:var(--f-head);font-weight:600;margin-left:6px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.25;margin:0 2px}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.opt .frm{font-size:18px}
.steps{margin:12px 0 0;padding:0;list-style:none;font-size:15px}
.steps li{padding:6px 0;border-bottom:1px dashed var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1.5px solid var(--ink);border-radius:5px;padding:2px 8px;font-size:15px;color:#1C2B3A}
.msg{margin-top:12px;font-size:15px}.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
.ruk-in{display:flex;gap:8px;align-items:center;margin-top:10px}.ruk-in input{max-width:140px}
.help h3{font-family:var(--f-head);font-size:22px;margin:22px 0 4px}
.help p{margin:0 0 10px;max-width:68ch}
.welcome{margin:6vh auto 0;text-align:center;max-width:560px}.welcome .row{justify-content:center}
.lesson{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
@media (max-width:860px){.lesson{grid-template-columns:1fr}}
.lesson .side h2{font-size:28px}.lesson .side p{margin:0 0 10px}
.lsteps{display:flex;gap:6px;margin:0 0 12px}.lsteps i{flex:1;height:5px;border-radius:3px;background:var(--btn)}.lsteps i.on{background:var(--ink)}
.lnav{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.rule{border-left:4px solid var(--mark);padding:6px 12px;background:color-mix(in srgb,var(--mark) 12%,var(--sheet));border-radius:0 6px 6px 0;margin:10px 0}
.tovj{position:fixed;right:20px;bottom:20px;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.18);margin:0}
:root{--cpos:#D62828;--cneg:#1D63C4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cpos:#FF3B30;--cneg:#6AA8FF}}
:root[data-theme="dark"]{--cpos:#FF3B30;--cneg:#6AA8FF}
svg.es [data-g]{transition:opacity .15s}svg.es.hov [data-g]:not(.on){opacity:.2}
svg.es [data-g].on circle{stroke-width:4;stroke:var(--mark)}svg.es [data-g].on line,svg.es [data-g].on path{stroke-width:5}
.meq{font-size:16px;margin:4px 0;padding:6px 8px;border-radius:6px;background:var(--btn)}.meq.cur{outline:2px solid var(--mark)}
.mbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.mbtns .opt{min-width:72px;text-align:center}
.dirgrid{display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center;margin:6px 0}
.dirgrid .opt{text-align:center;font-size:24px;padding:10px 0}.dirgrid .opt small{display:block;font-size:11px;color:var(--muted)}
.hidden{display:none!important}
@media (prefers-reduced-motion:no-preference){.opt{transition:border-color .12s}}
</style>

<script>
const BANK=JSON.parse(document.getElementById('bank').textContent);
const NETS=Object.fromEntries(BANK.nets.map(n=>[n.id,n]));
const QS=BANK.questions;
const TOPICS={serpar:'Serija i paralela',ruk:'Ukupni otpor'};
const TAGNAMES={dijagonala:'Otpornik u dijagonali',kratki_spoj:'Kratko spojeni otpornik',bez_struje:'Otpornik bez struje (slijepa grana)',skrivena_paralela:'Paralela koja ne izgleda kao paralela',udaljena_serija:'Serija kad otpornici nisu jedan do drugog',serija_iza_ugla:'Serija iza ugla',zajednicki_cvor:'Zajednički čvor, ali struja se grana',izgleda_paralelno:'Izgleda paralelno, a nije',formula_serija:'Formula za seriju',formula_paralela:'Formula za paralelu',formula_nista:'Kad nijedna formula ne vrijedi',redukcija:'Svođenje mreže na Ruk'};
const ANS={series:'serijski',parallel:'paralelno',none:'ni serijski ni paralelno'};

/* ---------- Spremište: lokalno sada, zajednička baza kasnije (ista sučelja) ---------- */
const Store={
  get(k,def){try{const v=localStorage.getItem('cvoriste-test:'+k);return v?JSON.parse(v):def}catch(e){return def}},
  set(k,v){try{localStorage.setItem('cvoriste-test:'+k,JSON.stringify(v))}catch(e){}}
};
let state=Store.get('state',{profiles:{},active:null,qstats:{}});
const Remote=(SUPABASE_URL&&SUPABASE_ANON_KEY&&window.supabase)?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false}}):null;
let session=Remote?Store.get('session',null):null,saveTimer=null,netWarn='';
function save(){Store.set('state',state);if(Remote&&session&&prof()){clearTimeout(saveTimer);saveTimer=setTimeout(pushState,1200)}}
async function pushState(){try{const {error}=await Remote.rpc('save_state',{p_token:session.token,p_state:prof()});netWarn=error?'Napredak se trenutačno ne sprema u bazu. Provjeri vezu.':''}catch(e){netWarn='Napredak se trenutačno ne sprema u bazu. Provjeri vezu.'}showNet()}
function showNet(){const el=document.getElementById('net');if(el){el.textContent=netWarn;el.classList.toggle('hidden',!netWarn)}}
function remoteRecord(q,score,help,qbase,qdelta){if(!Remote||!session)return;Remote.rpc('record_answer',{p_token:session.token,p_qid:q.id,p_topic:q.topic,p_score:score,p_help:!!help,p_mode:view==='exam'?'ispit':'vjezba',p_qbase:qbase,p_qdelta:qdelta}).then(({error})=>{if(error){netWarn='Odgovor nije spremljen u bazu. Provjeri vezu.';showNet()}})}
function fixProfile(p,nick){const base=newProfile(nick);for(const k in base)if(p[k]===undefined)p[k]=base[k];for(const t in base.ratings)if(!p.ratings[t])p.ratings[t]=base.ratings[t];if(!TOPICS[p.module])p.module='serpar';p.nick=nick;return p}
function adopt(nick,st){const p=fixProfile(st&&st.ratings?st:{},nick);state.profiles={[nick]:p};state.active=nick;Store.set('state',state)}
for(const k in state.profiles){const p=state.profiles[k];for(const t in TOPICS)if(!p.ratings[t])p.ratings[t]={r:2.0,n:0,c:0};if(!p.module||!TOPICS[p.module])p.module='serpar'}
function prof(){return state.profiles[state.active]}
function newProfile(nick){return {nick,ratings:{estat:{r:2.0,n:0,c:0},serpar:{r:2.0,n:0,c:0},formula:{r:2.0,n:0,c:0},ruk:{r:2.0,n:0,c:0}},module:'serpar',tags:{},recent:[],wrong:[],colors:false,answered:0,best:2.0,created:Date.now()}}
function qRating(q){const s=state.qstats[q.id];return s?s.r:q.diff}
function overall(p){let w=0,t=0;for(const k in p.ratings){if(!TOPICS[k])continue;const x=p.ratings[k];const ww=Math.max(1,x.n);w+=ww;t+=x.r*ww}return w?t/w:1}
const fmt=x=>x.toFixed(1).replace('.',',');

/* ---------- Model ocjenjivanja (Elo, skala 1–10) ---------- */
function pCorrect(s,q){return 1/3+(2/3)/(1+Math.pow(10,(q-s)/2))}
function applyResult(q,correct,usedColors){
  const score=typeof correct==='number'?correct:(correct?1:0);correct=score>=0.5;
  const p=prof(),R=p.ratings[q.topic];
  const qr=qRating(q),P=pCorrect(R.r,qr);
  const K=Math.max(0.25,1.0/Math.sqrt(1+R.n/6));
  let d=K*(score-P);
  if(d>0&&usedColors)d*=0.4;
  const before=R.r;
  R.r=Math.min(10,Math.max(1,R.r+d));R.n++;if(correct)R.c++;
  p.answered++;p.best=Math.max(p.best,overall(p));
  const dq=-0.15*(score-P);
  if(!usedColors){const s=state.qstats[q.id]||{r:q.diff,n:0,c:0};s.r=Math.min(10,Math.max(1,s.r+dq));s.n++;if(correct)s.c++;state.qstats[q.id]=s}
  remoteRecord(q,score,usedColors,q.diff,dq);
  for(const t of q.tags){const key=q.topic+':'+t,ts=p.tags[key]||{n:0,c:0};ts.n++;if(correct)ts.c++;p.tags[key]=ts}
  p.recent.push(q.id);if(p.recent.length>25)p.recent.shift();
  if(!correct)p.wrong.push({id:q.id,due:p.answered+5+Math.floor(Math.random()*5)});
  else p.wrong=p.wrong.filter(w=>w.id!==q.id);
  if(p.boost&&p.boost[q.topic])p.boost[q.topic]=correct?Math.max(0,p.boost[q.topic]-0.25):0;
  save();return R.r-before;
}
function weakTags(p,topic){const out=new Set();for(const k in p.tags){const [tp,t]=k.split(':');if(tp!==topic||!t)continue;const s=p.tags[k];if(s.n>=2&&s.c/s.n<0.6)out.add(t)}return out}
function pickQuestion(topic,exclude=new Set()){
  const p=prof(),s=p.ratings[topic].r+((p.boost&&p.boost[topic])||0);
  const due=p.wrong.find(w=>w.due<=p.answered&&!exclude.has(w.id)&&(QS.find(x=>x.id===w.id)||{}).topic===topic);
  if(due){const q=QS.find(x=>x.id===due.id);if(q)return q}
  const weak=weakTags(p,topic),recent=new Set(p.recent);
  let best=null,bs=1e9;
  for(const q of QS){
    if(q.topic!==topic||recent.has(q.id)||exclude.has(q.id))continue;
    let sc=Math.abs(qRating(q)-(s+0.3))+Math.random()*0.8;
    for(const t of q.tags)if(weak.has(t))sc-=0.35;
    if(sc<bs){bs=sc;best=q}
  }
  if(best)return best;const pool=QS.filter(q=>q.topic===topic);return pool[Math.floor(Math.random()*pool.length)];
}

/* ---------- Crtanje sheme ---------- */
const NODECOL=['#D7263D','#1D63C4','#22955A','#E07B12','#8A4FBF','#138F96','#C2378F','#8C5A2B','#5B7A12','#4B5BD6','#B8860B','#6E6E6E'];

/* Boje čvorova po potencijalu: A (viša stezaljka) crvena, B (niža) plava, između od toplije prema hladnijoj */
const WARM2COOL=['#C2378F','#E07B12','#B8860B','#8C5A2B','#5B7A12','#22955A','#138F96','#8A4FBF','#4B5BD6'];
const ILAB=(n,v)=>`I<tspan font-size="0.72em" dy="3">${n}</tspan><tspan dy="-3"> = ${v}</tspan>`,ULAB=(n,v)=>`U<tspan font-size="0.72em" dy="3">${n}</tspan><tspan dy="-3"> = ${v}</tspan>`;
function potColors(net){
  const ids=[...new Set(Object.values(net.node))],ix={};ids.forEach((n,i)=>ix[n]=i);
  const nA=net.node[net.A.join(',')],nB=net.node[net.B.join(',')],N=ids.length;
  const G=ids.map(()=>Array(N).fill(0)),b=Array(N).fill(0);
  for(const s of net.segs){if(s.k!=='r')continue;const u=ix[net.node[s.a.join(',')]],v=ix[net.node[s.b.join(',')]];if(u===v)continue;
    const g=1/((net.vals&&net.vals[s.n])||1);G[u][u]+=g;G[v][v]+=g;G[u][v]-=g;G[v][u]-=g}
  for(let i=0;i<N;i++){G[i][i]+=1e-6;b[i]+=0.5e-6}
  for(const[n,val]of[[nA,1],[nB,0]]){const i=ix[n];if(i===undefined)continue;G[i]=Array(N).fill(0);G[i][i]=1;b[i]=val}
  const A=G.map((r,i)=>[...r,b[i]]);
  for(let i=0;i<N;i++){let m=i;for(let r=i+1;r<N;r++)if(Math.abs(A[r][i])>Math.abs(A[m][i]))m=r;[A[i],A[m]]=[A[m],A[i]];for(let r=0;r<N;r++){if(r===i)continue;const f=A[r][i]/A[i][i];for(let c=i;c<=N;c++)A[r][c]-=f*A[i][c]}}
  const V={};ids.forEach((n,i)=>V[n]=A[i][N]/A[i][i]);

  const S=opts.S||130,pad=opts.pad||64,W=net.W*S+pad*2,H=net.H*S+pad*2;

  const ends={};
  const bump=p=>{const k=p.join(',');ends[k]=(ends[k]||0)+1};
  for(const s of net.segs){bump(s.a);bump(s.b)}
  bump(net.A);bump(net.B);
  const sw=opts.colors?4:2.5;
  for(const s of net.segs){
    const x1=X(s.a),y1=Y(s.a),x2=X(s.b),y2=Y(s.b);
    if(s.k==='w'){g+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${colOf(s.a)}" stroke-width="${sw}" stroke-linecap="round"/>`;continue}
    const L=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/L,uy=(y2-y1)/L,mx=(x1+x2)/2,my=(y1+y2)/2,bl=48,bw=17;
    const ax=mx-ux*bl/2,ay=my-uy*bl/2,bx=mx+ux*bl/2,by=my+uy*bl/2;
    g+=`<line x1="${x1}" y1="${y1}" x2="${ax}" y2="${ay}" stroke="${colOf(s.a)}" stroke-width="${sw}" stroke-linecap="round"/>`;
    g+=`<line x1="${bx}" y1="${by}" x2="${x2}" y2="${y2}" stroke="${colOf(s.b)}" stroke-width="${sw}" stroke-linecap="round"/>`;
    const ang=Math.atan2(uy,ux)*180/Math.PI,on=hl.has(s.n);
    const fill=on?'var(--mark)':(grp[s.n]||'var(--sheet)');
    g+=`<g data-r="${s.n}" ${opts.click?'style="cursor:pointer"':''}><rect x="${mx-bl/2-8}" y="${my-bw/2-12}" width="${bl+16}" height="${bw+24}" transform="rotate(${ang} ${mx} ${my})" fill="transparent"/>${net.cap?`<line x1="${ax}" y1="${ay}" x2="${mx-ux*6}" y2="${my-uy*6}" stroke="${colOf(s.a)}" stroke-width="${sw}"/><line x1="${mx+ux*6}" y1="${my+uy*6}" x2="${bx}" y2="${by}" stroke="${colOf(s.b)}" stroke-width="${sw}"/>${[-6,6].map(o=>`<line x1="${mx+ux*o-uy*17}" y1="${my+uy*o+ux*17}" x2="${mx+ux*o+uy*17}" y2="${my+uy*o-ux*17}" stroke="${on?'var(--mark)':ink}" stroke-width="${on?6:4}"/>`).join('')}`:`<rect x="${mx-bl/2}" y="${my-bw/2}" width="${bl}" height="${bw}" rx="1.5" transform="rotate(${ang} ${mx} ${my})" fill="${fill}" stroke="${ink}" stroke-width="${on?3.2:2.2}"/>`}</g>`;
    // oznaka okomito na otpornik
    let nx=-uy,ny=ux;if(ny>0||(Math.abs(ny)<1e-6&&nx>0)){nx=-nx;ny=-ny}
    if(s.d){nx=uy;ny=-ux;if(nx<0){nx=-nx;ny=-ny}}
    const lx=mx+nx*24,ly=my+ny*24+5;
    if(vals&&vals[s.n]!=null){const vx=-nx,vy=-ny,anc=Math.abs(vx)>0.6?(vx>0?'start':'end'):'middle',off=Math.abs(vx)>0.6?16:26;g+=`<text x="${mx+vx*off}" y="${my+vy*off+(vy>0.6?12:5)}" text-anchor="${anc}" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-size="16" font-weight="500" fill="var(--muted)">${typeof vals[s.n]==='string'?vals[s.n]:vals[s.n]+' Ω'}</text>`;if(opts.extra&&opts.extra[s.n])g+=`<text x="${mx+vx*off}" y="${my+vy*off+(vy>0.6?12:5)+18}" text-anchor="${anc}" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-size="16" font-weight="700" fill="var(--ok)" stroke="var(--sheet)" stroke-width="4" paint-order="stroke">${opts.extra[s.n]}</text>`;if(opts.flowLab&&opts.flowLab[s.n])g+=`<text x="${mx+vx*off}" y="${my+vy*off+(vy>0.6?12:5)+36}" text-anchor="${anc}" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-size="16" font-weight="700" fill="var(--ok)" stroke="var(--sheet)" stroke-width="4" paint-order="stroke">${opts.flowLab[s.n]}</text>`}
    if(opts.flow&&opts.flow[s.n]){const f=opts.flow[s.n],px=f>0?x1+(x2-x1)*0.2:x2+(x1-x2)*0.2,py=f>0?y1+(y2-y1)*0.2:y2+(y1-y2)*0.2,dx=ux*f,dy=uy*f;g+=`<path d="M${px+dx*9} ${py+dy*9}L${px-dx*7-dy*7} ${py-dy*7+dx*7}L${px-dx*7+dy*7} ${py-dy*7-dx*7}Z" fill="var(--ok)"/>`;}
    g+=`<text x="${lx}" y="${ly}" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-size="${on?21:18}" font-weight="${on?700:600}" fill="${ink}">${s.n.replace(/([RC])([\d,]+)/,'$1<tspan font-size="0.72em" dy="4">$2</tspan>')}</text>`;

  const te={};for(const [t,p] of [['A',net.A],['B',net.B]]){

    if(opts.src){g+=`<line x1="${tx}" y1="${ty}" x2="${ex}" y2="${ey}" stroke="${colOf(p)}" stroke-width="${sw}"/>`;continue}
    g+=`<line x1="${tx}" y1="${ty}" x2="${ex}" y2="${ey}" stroke="${colOf(p)}" stroke-width="${sw}"/><circle cx="${ex}" cy="${ey}" r="7" fill="var(--sheet)" stroke="${ink}" stroke-width="2.2"/><text x="${ex+(dir||1)*0}" y="${ey-14}" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-size="20" font-weight="700" fill="${ink}">${t}</text>`;
  }
  let shift=0;if(opts.src&&te.A[0]===te.B[0]){shift=typeof opts.src==='string'?90:70;g=`<rect x="${-shift}" width="${shift+1}" height="${H}" fill="url(#pg)"/>`+g;const sx=te.A[0]-46,[ax,ay]=te.A,[,by]=te.B,my=(ay+by)/2;
    g+=`<path d="M${ax} ${ay}H${sx}V${my-7}M${sx} ${my+7}V${by}H${ax}" stroke="${ink}" stroke-width="2.5" fill="none"/><line x1="${sx-20}" y1="${my-7}" x2="${sx+20}" y2="${my-7}" stroke="${ink}" stroke-width="3"/><line x1="${sx-10}" y1="${my+7}" x2="${sx+10}" y2="${my+7}" stroke="${ink}" stroke-width="5"/><text x="${sx+16}" y="${my-14}" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-size="18" font-weight="700" fill="${ink}">+</text><text x="${sx-26}" y="${my+7}" text-anchor="end" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-size="22" font-weight="700" fill="${ink}">U</text>${opts.srcI?`<path d="M${sx+30} ${ay-7}L${sx+44} ${ay}L${sx+30} ${ay+7}Z" fill="var(--ok)"/><text x="${sx+6}" y="${ay-12}" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-size="16" font-weight="700" fill="var(--ok)" stroke="var(--sheet)" stroke-width="4" paint-order="stroke">${opts.srcI}</text>`:''}${typeof opts.src==='string'?`<text x="${sx-26}" y="${my+28}" text-anchor="end" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-size="16" font-weight="500" fill="var(--muted)">${opts.src}</text>`:''}`}
  return `<svg viewBox="${-shift} 0 ${W+shift} ${H}" role="img" aria-label="Shema mreže ${net.id}" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
}

function explain(q){
  const n=NETS[q.net],st=n.status,a=q.r1,b=q.r2;
  const nodesOf=r=>{const s=n.segs.find(x=>x.n===r);return [n.node[s.a.join(',')],n.node[s.b.join(',')]]};
  const sh=[a,b].filter(r=>st[r]==='short'),dd=[a,b].filter(r=>st[r]==='dead');
  if(sh.length)return `${sh.join(' i ')} ${sh.length>1?'su kratko spojeni':'je kratko spojen'}: oba kraja su na istom potencijalu (iste boje), pa kroz ${sh.length>1?'njih':'njega'} ne teče struja. Zato nema smisla govoriti o seriji ili paraleli.`;
  if(dd.length)return `Kroz ${dd.join(' i ')} ne teče struja jer ${dd.length>1?'su':'je'} u slijepoj grani: struja nema kamo nastaviti. Takav otpornik nije ni u seriji ni u paraleli s ostalima.`;
  if(q.ans==='parallel')return `Oba otpornika spajaju ista dva potencijala (iste dvije boje). Na njima je isti napon, dakle spojeni su paralelno, bez obzira na to gdje su nacrtani.`;
  if(q.ans==='series')return `Kroz ${a} i ${b} teče ista struja: između njih je čvor na koji nije spojen nijedan drugi element koji vodi struju, pa struja nema kamo skrenuti.`;
  const A=nodesOf(a),B=nodesOf(b),common=A.filter(x=>B.includes(x));
  if(common.length)return `${a} i ${b} dijele jedan čvor, ali u tom čvoru struja se grana na druge elemente, pa nije ista struja. Drugi krajevi su im na različitim potencijalima, pa nije ni isti napon.`;
  return `${a} i ${b} nemaju zajednički čvor ni isti par potencijala: nije im ista ni struja ni napon.`;
}

function renderExam(){if(/^(kont|cvor|pretv)$/.test(prof().module))return metExam();
  const mod=prof().module,N=(mod==='ruk'||mod==='rukC')?3:mod==='estat'?8:10;
  if(!exam||exam.mod!==mod){
    const desc={estat:'Osam kratkih pitanja iz elektrostatike: smjer sile i polja, zbrajanje vektora, rad i energija.',serpar:'Deset pitanja o tome jesu li otpornici u seriji, paraleli ili ništa od toga.',formula:'Deset pitanja: za označeni par odaberi točnu formulu.',rukC:'Tri mreže s kondenzatorima koje svodiš na C<sub>uk</sub>. Pazi: formule su obrnute nego kod otpornika.',serparC:'Deset pitanja o spoju kondenzatora.',ruk:'Tri mreže koje svodiš na R<sub>uk</sub>, bez bojica.'}[mod];

  if(mod==='estat'&&exam.running)return estatExamRun();
  if(exam.running){
    const q=exam.qs[exam.i];
    if((mod==='ruk'||mod==='rukC')){if(!rk||!rk.exam||rk.q.id!==q.id){startRuk(q);rk.exam=true}return renderRuk()}

function solveSteps(n){
  const S={groups:n.segs.filter(s=>s.k==='r').map(s=>({members:[s.n],a:n.node[s.a.join(',')],b:n.node[s.b.join(',')],v:n.vals[s.n]})),nA:n.node[n.A.join(',')],nB:n.node[n.B.join(',')]},out=[];
  for(let guard=0;guard<40&&S.groups.length>1;guard++){
    let found=false;
    for(let i=0;i<S.groups.length&&!found;i++)for(let j=i+1;j<S.groups.length&&!found;j++){
      const g1=S.groups[i],g2=S.groups[j],r=rkRel(g1,g2,S);if(r==='none')continue;
      const A=sub(grpName(g1.members)),B=sub(grpName(g2.members)),members=[...g1.members,...g2.members],nm=sub(grpName(members));let ng;
      if(r==='parallel'){ng={members,a:g1.a,b:g1.b,v:g1.v*g2.v/(g1.v+g2.v)};out.push(`${nm} = ${A} ∥ ${B}`)}
      else{const sh=[g1.a,g1.b].find(v=>v===g2.a||v===g2.b);ng={members,a:g1.a===sh?g1.b:g1.a,b:g2.a===sh?g2.b:g2.a,v:g1.v+g2.v};out.push(`${nm} = ${A} + ${B}`)}
      S.groups=S.groups.filter(g=>g!==g1&&g!==g2);S.groups.push(ng);found=true}
    if(!found)break}
  return out;
}

const sub=n=>{const m=String(n).match(/^([RC])(.+)$/);return m?`${m[1]}<sub>${m[2]}</sub>`:n};
const fv=x=>{const r=Math.round(x*100)/100;return String(r).replace('.',',')};

function grpName(members){const nums=members.map(m=>+m.slice(1)).sort((a,b)=>a-b);return members[0][0]+(nums.every(n=>n<10)?nums.join(''):nums.join(','))}
function seeded(str){let h=2166136261;for(const c of str)h=Math.imul(h^c.charCodeAt(0),16777619);return()=>{h=Math.imul(h^(h>>>15),2246822507);h=Math.imul(h^(h>>>13),3266489909);return((h^=h>>>16)>>>0)/4294967296}}
function shuffle(arr,key){const r=seeded(key);for(let i=arr.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}

/* ---------- Modul: formule ---------- */
let fq=null,fAns=false;
function offerX1(q){const p=prof();return p.ratings.formula.c<5&&q.diff<4}
function formulaOptions(q){
  const a=sub(q.r1),b=sub(q.r2);
  const f=shuffle([
    {k:'ser',h:`${a} + ${b}`},
    {k:'par',h:`<span class="frac"><span>${a} · ${b}</span><span>${a} + ${b}</span></span>`},
    {k:'x1',h:`<span class="frac"><span>${a} + ${b}</span><span>${a} · ${b}</span></span>`}].filter(o=>o.k!=='x1'||offerX1(q)),q.id);
  return [...f,{k:'none',h:'ništa od navedenog'}];
}
function renderFormula(){
  const p=prof();
  if(!fq||fAns===null){fq=pickQuestion('formula');fAns=false}
  const q=fq,n=NETS[q.net],opts=formulaOptions(q);
  const showCol=p.colors||fAns;
  const text=`Kojom formulom računaš zamjenski otpor otpornika <strong>${sub(q.r1)}</strong> i <strong>${sub(q.r2)}</strong>?`;
  main.innerHTML=`<div class="board"><div class="sheet"><div class="meta"><span>Mreža ${n.id}</span><span>težina pitanja ${fmt(qRating(q))}</span></div><div class="schem">${drawNet(n,{colors:showCol,highlight:[q.r1,q.r2]})}</div></div>
  <div class="sheet side"><p class="q">${text}</p><div class="opts">${opts.map((o,i)=>`<button class="opt" data-a="${o.k}"><kbd>${'abcd'[i]})</kbd><span class="frm">${o.h}</span></button>`).join('')}</div><div id="fb"></div>
  <label class="toggle"><input type="checkbox" id="col" ${p.colors?'checked':''} ${fAns?'disabled':''}><span>Bojice potencijala<small>Pomažu vidjeti jesu li u seriji ili paraleli. Točan odgovor s bojicama donosi manje napretka.</small></span></label></div></div>`;
  modbar();
  $('#col').onchange=e=>{p.colors=e.target.checked;save();renderFormula()};
  main.querySelectorAll('.opt').forEach((b,i)=>{b.dataset.a=opts[i].k;b.onclick=()=>answerFormula(b.dataset.a)});
  // tipke a-d preslikavamo na redoslijed
  main.querySelectorAll('.opt').forEach((b,i)=>{b.dataset.key='abcd'[i];b.querySelector('kbd').textContent='abcd'[i]+')'});
}
function answerFormula(a){
  if(fAns)return;fAns=true;
  const p=prof(),q=fq,correctK={series:'ser',parallel:'par',none:'none'}[q.ans],ok=a===correctK,usedCol=p.colors;
  const d=applyResult(q,ok,usedCol);
  renderFormula();
  main.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.a===correctK)b.classList.add('right');else if(b.dataset.a===a)b.classList.add('wrong')});
  const A=sub(q.r1),B=sub(q.r2);
  const why=q.ans==='series'?`${A} i ${B} su u seriji (kroz njih teče ista struja), pa se otpori zbrajaju: ${A} + ${B}.`
    :q.ans==='parallel'?`${A} i ${B} su u paraleli (isti napon), pa je zamjenski otpor „puta kroz plus”: <span class="frac"><span>${A} · ${B}</span><span>${A} + ${B}</span></span>.`
    :`${A} i ${B} nisu ni u seriji ni u paraleli, pa ih ne možeš zamijeniti jednim otporom nijednom od ovih formula. ${explain(q)}`;
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><h3>${ok?'Točno':'Nije točno'}</h3><p style="margin:0 0 6px">${why}</p>
  <span class="delta">Razina ${d>=0?'+':'−'}${fmt(Math.abs(d))} → ${fmt(p.ratings.formula.r)}</span><br><button class="primary" id="next">Sljedeće pitanje</button></div>`;
  header();$('#next').focus();$('#next').onclick=()=>{fAns=null;renderFormula()};
}

/* ---------- Modul: ukupni otpor korak po korak ---------- */
const GCOL=['#BFE3D0','#C9D8F5','#F5D6BF','#E3CDF2','#F2C9D9','#CDEBEA','#E5E5C2','#D9D9D9'];
let rk=null;
function rkNodes(segs,net){
  const par={},f=x=>{while(par[x]!==undefined&&par[x]!==x)x=par[x];return x};
  const key=p=>p.join(',');
  for(const s of segs){for(const p of [s.a,s.b])if(par[key(p)]===undefined)par[key(p)]=key(p)}
  for(const p of [net.A,net.B])if(par[key(p)]===undefined)par[key(p)]=key(p);
  for(const s of segs)if(s.k==='w'){const a=f(key(s.a)),b=f(key(s.b));if(a!==b)par[a]=b}
  const ids={},node={};let c=0;
  for(const k in par){const r=f(k);if(ids[r]===undefined)ids[r]=c++;node[k]=ids[r]}
  return node;
}
function rkPrune(){
  let ch=true;
  while(ch){ch=false;const dg={};for(const s of rk.segs)for(const p of [s.a,s.b]){const k=p.join(',');dg[k]=(dg[k]||0)+1}
    const t=new Set([rk.n.A.join(','),rk.n.B.join(',')]);
    const idx=rk.segs.findIndex(s=>s.k==='w'&&[s.a,s.b].some(p=>dg[p.join(',')]===1&&!t.has(p.join(','))));
    if(idx>=0){rk.segs.splice(idx,1);ch=true}}
}
function rkState(){
  const node=rkNodes(rk.segs,rk.n);
  const groups=rk.segs.filter(s=>s.k==='r').map(s=>({seg:s,members:s.m,a:node[s.a.join(',')],b:node[s.b.join(',')]}));
  return {node,groups,nA:node[rk.n.A.join(',')],nB:node[rk.n.B.join(',')]};
}
function startRuk(q0){
  const q=q0||pickQuestion(prof().module==='rukC'?'rukC':'ruk'),n=NETS[q.net];
  const segs=n.segs.map(s=>({...s,a:[...s.a],b:[...s.b],m:s.k==='r'?[s.n]:null}));
  rk={q,n,segs,sel:[],steps:[],mistakes:0,msg:'',msgOk:false,done:false};
}
function rkRel(g1,g2,S){
  const deg={};for(const g of S.groups){deg[g.a]=(deg[g.a]||0)+1;deg[g.b]=(deg[g.b]||0)+1}
  if((g1.a===g2.a&&g1.b===g2.b)||(g1.a===g2.b&&g1.b===g2.a))return 'parallel';
  for(const v of [g1.a,g1.b])if((v===g2.a||v===g2.b)&&deg[v]===2&&v!==S.nA&&v!==S.nB)return 'series';
  return 'none';
}
function rkFinishedS(S){if(S.groups.length!==1)return false;const g=S.groups[0];return (g.a===S.nA&&g.b===S.nB)||(g.a===S.nB&&g.b===S.nA)}
function rkFinished(){return rkFinishedS(rkState())}
function renderRuk(){
  const p=prof();
  if(!rk||(rk.q.topic!==p.module&&!rk.exam))startRuk();
  const {n,q}=rk,ex=!!rk.exam,S=rkState(),finished=rkFinishedS(S);
  const view={...n,segs:rk.segs,node:S.node};
  const groupsMap={};rk.segs.forEach((s,i)=>{/* zamjenski otpornici izgledaju kao ostali */});
  const hl=rk.sel.slice();
  let action='';
  if(finished&&!rk.done)rkComplete();
  if(rk.done){
    const ok=rk.mistakes===0;
    action=`<div class="fb ${ok?'ok':'bad'}"><h3>${ok?'Bez greške':'Gotovo'}</h3><p style="margin:0">Mreža je svedena na jedan ${rk.n.cap?'kondenzator: C':'otpor: R'}<sub>uk</sub> = ${sub(grpName(S.groups[0].members))}. Pogrešnih koraka: ${rk.mistakes}.</p>${ex?'':`<span class="delta">Razina ${rk.final.d>=0?'+':'−'}${fmt(Math.abs(rk.final.d))} → ${fmt(p.ratings[rk.q.topic].r)}</span><br>`}<button class="primary" id="next">${ex?'Dalje':'Sljedeći zadatak'}</button></div>`;
  }else if(rk.sel.length===2){
    const A=sub(rk.sel[0]),B=sub(rk.sel[1]);
    action=`<p class="q" style="margin-top:14px">Kako spajaš ${A} i ${B}?</p><div class="opts">
    <button class="opt" data-op="series"><kbd>a)</kbd>Serija: <span class="frm">${rk.n.cap?FR(A,B):`${A} + ${B}`}</span></button>
    <button class="opt" data-op="parallel"><kbd>b)</kbd>Paralela: <span class="frm">${rk.n.cap?`${A} + ${B}`:FR(A,B)}</span></button>
    <button class="ghost" id="cancel" style="margin-top:4px">Odaberi druge</button></div>`;
  }else{
    action=`<p class="note" style="margin-top:14px">${rk.sel.length?(rk.n.cap?'Odaberi još jedan kondenzator.':'Odaberi još jedan otpornik.'):(rk.n.cap?'Klikni dva kondenzatora koja želiš zamijeniti jednim.':'Klikni dva otpornika koja želiš zamijeniti jednim.')}</p>`;
  }
  const steps=rk.steps.map(s=>`<li>${s}</li>`).join('');
  main.innerHTML=`<div class="board"><div class="sheet"><div class="meta"><span>${ex?`Zadatak ${exam.i+1} od ${exam.qs.length}`:'Mreža '+n.id}</span><span ${ex?'class="timer" id="tm"':''}>${ex?'':'težina zadatka '+fmt(qRating(q))}</span></div><div class="schem" id="rsch">${drawNet(view,{colors:ex?false:p.colors,highlight:hl,groups:groupsMap,click:!rk.done})}</div></div>
  <div class="sheet side"><p class="q" style="margin-bottom:4px">Svedi mrežu na jedan ${rk.n.cap?'kondenzator C':'otpor R'}<sub>uk</sub> gledano sa stezaljki A i B.</p>
  ${action}<div class="msg ${rk.msgOk?'ok':'bad'}">${rk.msg}</div>
  ${steps?`<ol class="steps">${steps}</ol>`:''}
  ${ex?'':`<label class="toggle"><input type="checkbox" id="col" ${p.colors?'checked':''} ${rk.done?'disabled':''}><span>Bojice potencijala<small>Zadatak riješen uz bojice donosi manje napretka.</small></span></label>`}</div></div>`;
  modbar();
  if(ex)examTick();else{$('#col').onchange=e=>{p.colors=e.target.checked;if(p.colors)rk.usedHelp=true;save();renderRuk()};if(p.colors&&!rk.done)rk.usedHelp=true}
  if(!rk.done)$('#rsch').querySelectorAll('[data-r]').forEach(el=>el.onclick=()=>{
    const nm=el.dataset.r;rk.msg='';
    if(rk.sel.includes(nm))rk.sel=rk.sel.filter(x=>x!==nm);else if(rk.sel.length<2)rk.sel.push(nm);else rk.sel=[nm];
    renderRuk()});
  main.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>rkMerge(b.dataset.op));
  if($('#cancel'))$('#cancel').onclick=()=>{rk.sel=[];rk.msg='';renderRuk()};
  if($('#next'))$('#next').onclick=()=>{
    if(ex){exam.res.push({ok:rk.mistakes===0,mistakes:rk.mistakes});exam.i++;rk=null;if(exam.i>=exam.qs.length){exam.running=false;exam.t1=Date.now()}header();return renderExam()}
    rk=null;renderRuk()};
}
function rkMerge(op){
  const S=rkState(),g1=S.groups.find(g=>g.seg.n===rk.sel[0]),g2=S.groups.find(g=>g.seg.n===rk.sel[1]);
  const rel=rkRel(g1,g2,S),A=sub(g1.seg.n),B=sub(g2.seg.n);
  if(rel!==op){
    rk.mistakes++;rk.msgOk=false;
    rk.msg=rel==='none'?`${A} i ${B} nisu ni u seriji ni u paraleli. Potraži par koji dijeli čvor na koji ništa drugo nije spojeno, ili par spojen na ista dva potencijala.`
      :rel==='series'?`${A} i ${B} jesu povezani, ali u seriju: između njih je čvor na koji ništa drugo nije spojeno.`
      :`${A} i ${B} jesu povezani, ali paralelno: spojeni su na ista dva potencijala.`;
    rk.sel=[];return renderRuk();
  }
  const members=[...g1.members,...g2.members],nm=grpName(members);
  // prvi odabrani ostaje kao zamjenski otpornik, drugi nestaje
  g1.seg.n=nm;g1.seg.m=members;
  if(op==='series'){g2.seg.k='w';delete g2.seg.n;g2.seg.m=null;rk.steps.push(`${sub(nm)} = ${rk.n.cap?FR(A,B):A+' + '+B}`)}
  else{rk.segs.splice(rk.segs.indexOf(g2.seg),1);rkPrune();rk.steps.push(`${sub(nm)} = ${A} ∥ ${B} = ${rk.n.cap?`${A} + ${B}`:FR(A,B)}`)}
  rk.sel=[];rk.msgOk=true;rk.msg=op==='series'?`Dobro, serija. ${A} i ${B} zamijenjeni su s ${sub(nm)}.`:`Dobro, paralela. ${A} i ${B} zamijenjeni su s ${sub(nm)}.`;
  renderRuk();
}
function rkComplete(){
  rk.done=true;
  if(rk.exam){applyResult(rk.q,rk.mistakes===0?1:Math.max(0,1-0.35*rk.mistakes),false);rk.final={d:0};return}
  const d=applyResult(rk.q,rk.mistakes===0?1:Math.max(0,1-0.35*rk.mistakes),!!rk.usedHelp);
  rk.final={d};header();
}

  ${rows?`<table><tr><th>Gradivo</th><th>Korisnika</th><th>Zadataka</th><th>Točno</th><th>Prosječna razina</th><th>Tvoja razina</th></tr>${rows}</table>`:''}
  <p style="margin:18px 0 4px;font-weight:600">Aktivni korisnici po danu (zadnjih 30 dana)</p>${bars}
  <p class="note">Prikazani su samo zbirni podaci. Prosječna razina vidi se tek kad gradivo vježba barem 5 korisnika.</p>`}

/* ---------- Brisanje profila ---------- */
function delAsk(){const box=$('#rstbox'),p=prof();box.innerHTML=`<div class="sheet" style="margin-top:20px;padding:16px;border-color:var(--bad)"><p style="margin:0 0 10px"><b>Obrisati profil „${p.nick.replace(/[<>&]/g,'')}“?</b> Nadimak, razine i svi rezultati bit će trajno obrisani${Remote?' iz baze':''}. Ovo se ne može poništiti.</p>
  ${Remote?`<label>Za potvrdu upiši svoj PIN<br><input type="password" id="delpin" inputmode="numeric" maxlength="4" style="max-width:140px;margin:4px 0 10px" autocomplete="off"></label>`:''}
  <div class="row"><button class="primary" id="dely" style="margin:0;background:var(--bad)">Trajno obriši profil</button><button class="ghost" id="deln">Odustani</button></div><p class="msg bad" id="delerr"></p></div>`;
  $('#deln').onclick=()=>{box.innerHTML=''};
  $('#dely').onclick=async()=>{const err=$('#delerr');
    if(Remote){const pin=$('#delpin').value.trim();if(!/^\d{4}$/.test(pin)){err.textContent='Upiši PIN od 4 znamenke.';return}
      err.textContent='Brišem…';try{const {error}=await Remote.rpc('delete_profile',{p_token:session.token,p_pin:pin});if(error){err.textContent=(error.message||'').includes('bad_pin')?'PIN nije točan.':'Brisanje trenutačno ne uspijeva. Pokušaj ponovno.';return}}catch(e){err.textContent='Nema veze s bazom.';return}
      clearTimeout(saveTimer);session=null;Store.set('session',null);state.profiles={}}
    else delete state.profiles[p.nick];
    state.active=null;Store.set('state',state);view='home';render();
    const m=main.querySelector('.panel');if(m)m.insertAdjacentHTML('afterbegin','<p class="msg ok" style="margin-top:0">Profil je obrisan.</p>')}}

/* ---------- Ljestvica: ukupno ---------- */
let boardAll=false;
{const _mb=modbar;modbar=function(){_mb();if(view!=='board')return;const bar=main.querySelector('.modbar');if(!bar)return;
  bar.insertAdjacentHTML('afterbegin',`<button data-all="1" aria-current="${boardAll}">Ukupno</button>`);
  bar.addEventListener('click',e=>{if(e.target.closest('[data-m]'))boardAll=false},true);
  bar.querySelector('[data-all]').onclick=()=>{boardAll=true;render()};
  if(boardAll){bar.querySelectorAll('[data-m]').forEach(b=>b.setAttribute('aria-current','false'));main.querySelectorAll('.modbar[aria-label]:not([role])').forEach(b=>b.remove());const l=main.querySelector('.modlvl');if(l)l.innerHTML=`Tvoja ukupna razina: <b>${fmt(overall(prof()))}</b>`}}}
{const _rb=renderBoard;renderBoard=function(){if(boardAll)return renderBoardAll();return _rb.apply(this,arguments)}}
async function renderBoardAll(){const me=prof().nick,head='<h2>Ljestvica: ukupno</h2>';let rows=[],err='';
  if(Remote){main.innerHTML=`<div class="sheet panel">${head}<p class="note">Učitavam…</p></div>`;modbar();
    try{const {data,error}=await Remote.rpc('leaderboard_total');if(error)err='Ljestvica se trenutačno ne može učitati.';else rows=data}catch(e){err='Nema veze s bazom.'}
    if(view!=='board'||!boardAll)return}
  else rows=Object.values(state.profiles).map(p=>({nick:p.nick,r:overall(p),n:Object.keys(TOPICS).reduce((s,k)=>s+((p.ratings[k]||{}).n||0),0)})).filter(x=>x.n>0).sort((a,b)=>b.r-a.r);
  main.innerHTML=`<div class="sheet panel">${head}${err?`<p class="msg bad">${err}</p>`:''}
  <table><tr><th></th><th>Nadimak</th><th>Ukupna razina</th><th>Riješeno</th></tr>
  ${rows.map((p,i)=>`<tr${p.nick===me?' style="font-weight:700"':''}><td>${i+1}.</td><td>${String(p.nick).replace(/[<>&]/g,'')}</td><td class="num">${fmt(p.r)}</td><td>${p.n}</td></tr>`).join('')||'<tr><td colspan="4">Još nema rezultata.</td></tr>'}</table>
  <p class="note">Ukupna razina je prosjek razina iz svih gradiva, pri čemu gradiva s više riješenih zadataka imaju veću težinu.</p>
  ${Remote?'<div id="stats"><p class="note">Učitavam statistiku…</p></div>':'<p class="note">Ljestvica prikazuje samo nadimke koji su vježbali u ovom pregledniku.</p>'}</div>`;
  modbar();if(Remote)boardStats(null)}
const th=Store.get('theme',null);if(th)document.documentElement.dataset.theme=th;
async function boot(){
  if(Remote){
    if(!session){state.profiles={};state.active=null}
    main.innerHTML='<div class="sheet panel"><p class="note">Spajam se na bazu…</p></div>';
    try{const {data}=await Remote.rpc('get_qstats');if(data){state.qstats={};for(const r of data)state.qstats[r.qid]={r:r.r,n:r.n,c:r.c}}}catch(e){}
    if(session){try{const {data,error}=await Remote.rpc('resume',{p_token:session.token});if(!error&&data&&data.length)adopt(data[0].nick,data[0].state);else{session=null;Store.set('session',null);state.profiles={};state.active=null}}catch(e){netWarn='Nema veze s bazom, radim s lokalnom kopijom.'}}
  }
  render();showNet();
}
view='home';
boot();
</script>
</body>
</html>
